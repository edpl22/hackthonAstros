# Os serviços sem tela usam a mesma imagem (estágio `base`); o build roda uma vez e o cache serve
# aos demais. O serviço `gui` usa o estágio `gui`, que acrescenta Xvfb e noVNC.
x-atlas: &atlas
  build:
    context: .
    target: base
  image: atlas:local

services:
  verificar:
    <<: *atlas
    command: ["verificar"]
  demo:
    <<: *atlas
    command: ["demo", "todas", "--saida", "/saida"]
    volumes: ["./saida:/saida"]
  teste:
    <<: *atlas
    entrypoint: ["python", "-m", "pytest", "-q"]
  agente:
    <<: *atlas
    stdin_open: true
    command: ["agente", "treino"]  # vira "silabas" quando o Ímã das Sílabas existir (Etapa 4)
  gui:
    build:
      context: .
      target: gui
    image: atlas:gui
    command: ["gui"]
    ports: ["6080:6080"]
