# Os serviços sem tela usam a mesma imagem (estágio `base`); o build roda uma vez e o cache serve
# aos demais.
x-atlas: &atlas
  build:
    context: .
    target: base
  image: atlas:local

services:
  verificar:
    <<: *atlas
    command: ["verificar"]
  demo:
    <<: *atlas
    command: ["demo", "todas", "--saida", "/saida"]
    volumes: ["./saida:/saida"]
  teste:
    <<: *atlas
    entrypoint: ["python", "-m", "pytest", "-q"]
  agente:
    <<: *atlas
    stdin_open: true
    command: ["agente", "silabas"]
