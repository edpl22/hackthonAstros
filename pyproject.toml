[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "1.0.3"
description = "Português e matemática com o corpo, adaptado ao perfil de cada aluno."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6-Essentials>=6.7,!=6.12.0",  # 6.12.0 no Linux: bug de refcount do None (DECISOES.md)
]

[project.optional-dependencies]
# Câmera: opcional. Sem estes pacotes o app usa mouse, toque e teclado.
# O mediapipe já depende de opencv-contrib-python; usar o mesmo pacote evita dois cv2.
camera = [
    "opencv-contrib-python>=4.10",
    "mediapipe>=0.10.14",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
audio = [
    "google-cloud-texttospeech>=2.16",
]
empacotamento = [
    "pyinstaller>=6.6",
]

[project.scripts]
atlas = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
