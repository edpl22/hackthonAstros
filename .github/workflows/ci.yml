name: CI

on:
  push:
  pull_request:

jobs:
  # Só o núcleo (sem opencv/mediapipe): prova que testes e modos sem tela não dependem da câmera.
  testes:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      ATLAS_AUDIO: nulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bibliotecas de sistema do Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Dependências
        run: |
          pip install -r requirements.txt
          pip install --no-deps .

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: atlas verificar
        run: atlas verificar

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker compose build

      - name: verificar
        run: |
          docker compose run --rm verificar | tee verificar.txt
          grep -q "RESULTADO: pronto" verificar.txt

      - name: demo
        run: |
          docker compose run --rm demo
          test -f saida/relatorio.md

      - name: teste
        run: docker compose run --rm teste

      - name: Tamanho da imagem
        run: docker image ls atlas:local

      - uses: actions/upload-artifact@v4
        with:
          name: saida-demo
          path: saida/
