name: Release

# A cada tag v*: instaladores Windows e macOS (PyInstaller, onedir, em zip) anexados à Release
# e a imagem Docker publicada em ghcr.io/edpl22/atlas (<tag> e latest).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  instaladores:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zip: Atlas-windows.zip
          - os: macos-latest
            zip: Atlas-macos.zip
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      ATLAS_AUDIO: nulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependências
        run: |
          pip install -r requirements.txt -r requirements-camera.txt
          pip install pyinstaller==6.16.0

      - name: PyInstaller
        run: pyinstaller empacotamento/atlas.spec --noconfirm --log-level WARN

      - name: Teste de fumaça (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dist/Atlas/Atlas.exe verificar --completo | tee verificar.txt
          grep -q "RESULTADO: pronto" verificar.txt
          dist/Atlas/Atlas.exe demo silabas --saida fumaca
          test -s fumaca/relatorio.md

      - name: Teste de fumaça (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/Atlas.app/Contents/MacOS/Atlas verificar --completo | tee verificar.txt
          grep -q "RESULTADO: pronto" verificar.txt
          dist/Atlas.app/Contents/MacOS/Atlas demo silabas --saida fumaca
          test -s fumaca/relatorio.md

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Atlas -DestinationPath ${{ matrix.zip }}

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Atlas.app ${{ matrix.zip }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  publicar:
    needs: instaladores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Atlas-*.zip  # só os instaladores (o build Docker também gera um artefato)
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Atlas-windows.zip
            Atlas-macos.zip

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/edpl22/atlas:${{ github.ref_name }}
            ghcr.io/edpl22/atlas:latest
